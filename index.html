<!DOCTYPE html>
<html lang="eng">
<head>
    <meta charset="UTF-8">
    <title>Daily Entry</title>
    <link rel="stylesheet" href="./index.css">
    <link rel="stylesheet" href="./shared.css">
</head>

<body>
    <nav>
        <a href="./index.html">Home</a>
        <a href="./stats.html">Stats</a>
    </nav>


    <h1 class="title">Daily Entry</h1>
    <form method="post" action="https://script.google.com/macros/s/AKfycbxPSGxD6hH13LBhhsN1vSX8sTT4JZv1q8rVQs7PZS3u9dgCo6992zua043oPZFi4sXW/exec">
        <div class="date">
            <label for="Date">Todays Date</label>
            <input name="Date" type="date"><br>
        </div>

        <div class="Breakfast">
            <label for="Breakfast">What did you have for breakfast?</label>
            <input name="Breakfast" type="text"><br>
        </div>

        <div class="Lunch">
            <label for="Lunch">What did you have for lunch?</label>
            <input name="Lunch" type="text"><br>
        </div>
        
        <div class="Dinner">
            <label for="Dinner">What did you have for dinner?</label>
            <input name="Dinner" type="text"><br>
        </div>
        
        <div class="AmountofWater">
            <label for="AmountofWater">Select amount of water you have drank</label>
            <select name="AmountofWater">
                <option value="0L-0.9L">0L-0.9L</option>
                <option value="1L-1.9L">1L-1.9L</option>
                <option value="2L-2.9L">2L-2.9L</option>
                <option value="3L-3.9L">3L-3.9L</option>
                <option value="4L-4.9L">4L-4.9L</option>
                <option value="5L-5.9">5L-5.9L</option>
                <option value="6L-6.9L">6L-6.9L</option>
                <option value="7L-7.9L">7L-7.9L</option>
                <option value="8L-8.9L">8L-8.9L</option>
                <option value="9L-9.9L">9L-9.9L</option>
                <option value="10L+">10L+</option>
            </select><br>
        </div>
        
        <div class="Sympotoms">
            <label for="Sympotms">Sympotms:</label>
            <input id="Sympotoms" name="Sympotms" type="textarea"><br>
        </div>

        <button type="submit">Send</button>
    </form>
</body>



</html>
